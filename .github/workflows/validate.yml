name: Validate skill

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Run repository validation
        run: python scripts/validate_skill.py
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
